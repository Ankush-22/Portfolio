<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankush Kumar Mallick | Galactic AI Engineer</title>
    
    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyan: { 400: '#22d3ee', 500: '#06b6d4' }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap');

        :root {
            --bg-dark: #000000;
            --glass-bg: rgba(26, 26, 26, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-dark);
            color: white;
            overflow-x: hidden;
        }
        
        .font-outfit { font-family: 'Outfit', sans-serif; }

        /* Star Field */
        .star-field {
            position: fixed;
            inset: 0;
            z-index: -10;
            background: radial-gradient(circle at center, #050515 0%, #000000 100%);
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
        }

        /* Outer Glow */
        .outer-glow {
            position: fixed;
            inset: 0;
            z-index: -5;
            pointer-events: none;
            box-shadow: inset 0 0 200px rgba(59, 130, 246, 0.15);
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
        }

        .glass-card {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-8px);
        }

        /* Glitch Effect */
        .glitch-hover:hover {
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(-3px, -3px); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(3px, -3px); }
            100% { transform: translate(0); }
        }

        .btn-white {
            background: #ffffff;
            color: #000000;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="dark">
    <div class="star-field" id="starField"></div>
    <div class="outer-glow"></div>
    
    <div id="root"></div>

    <script type="text/babel">
        // --- STAR GENERATION ---
        const StarGenerator = () => {
            React.useEffect(() => {
                const field = document.getElementById('starField');
                for (let i = 0; i < 200; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    const size = Math.random() * 2;
                    star.style.width = `${size}px`;
                    star.style.height = `${size}px`;
                    star.style.top = `${Math.random() * 100}%`;
                    star.style.left = `${Math.random() * 100}%`;
                    star.style.opacity = Math.random();
                    field.appendChild(star);
                }
            }, []);
            return null;
        };

        // --- COMPONENTS ---

        const Navbar = () => {
            const [scrolled, setScrolled] = React.useState(false);
            React.useEffect(() => {
                const h = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', h);
                return () => window.removeEventListener('scroll', h);
            }, []);

            return (
                <nav className={`fixed left-1/2 -translate-x-1/2 z-[100] transition-all duration-700 ${scrolled ? 'top-6' : 'top-10 w-[90%] max-w-5xl'}`}>
                    <div className={`px-10 py-4 glass rounded-full flex justify-center items-center gap-12 ${scrolled ? 'shadow-2xl border-white/20' : 'border-transparent bg-transparent'}`}>
                        {['Home', 'About', 'Experience', 'Projects', 'Contact'].map(l => (
                            <a key={l} href={`#${l.toLowerCase()==='home'?'hero':l.toLowerCase()}`} className="text-[10px] font-bold uppercase tracking-[0.3em] text-slate-400 hover:text-white transition-colors">{l}</a>
                        ))}
                    </div>
                </nav>
            );
        };

        const Hero = () => {
             const phrases = [
                "Building intelligent systems with AI/ML",
                "Solving real-world problems with data",
                "Architecting Agentic AI solutions"
            ];
            
            const [index, setIndex] = React.useState(0);
            const [subIndex, setSubIndex] = React.useState(0);
            const [reverse, setReverse] = React.useState(false);

            React.useEffect(() => {
                const t = setTimeout(() => {
                    if (subIndex === phrases[index].length + 1 && !reverse) return setReverse(true);
                    if (subIndex === 0 && reverse) {
                        setReverse(false);
                        setIndex((prev) => (prev + 1) % phrases.length);
                        return;
                    }
                    setSubIndex(p => p + (reverse ? -1 : 1));
                }, reverse ? 75 : 150);
                return () => clearTimeout(t);
            }, [subIndex, index, reverse]);

            return (
                <section id="hero" className="min-h-screen flex flex-col items-center justify-center text-center px-6 pt-20">
                    <div className="space-y-10 max-w-5xl">
                        <div className="inline-block px-4 py-1.5 glass rounded-full text-[9px] font-bold uppercase tracking-[0.3em] text-cyan-400 border-white/10">AI ENGINEER</div>
                        <h1 className="text-6xl md:text-9xl font-outfit font-bold text-white leading-tight glitch-hover cursor-default transition-all" data-text="Ankush Kumar Mallick">
                            Ankush Kumar Mallick
                        </h1>
                        <div className="h-12 text-2xl md:text-3xl font-light text-slate-400 leading-relaxed">
                             <span className="font-bold text-white transition-all underline decoration-cyan-500/30">{phrases[index].substring(0, subIndex)}</span>|
                        </div>
                        <p className="text-slate-400 max-w-2xl mx-auto leading-relaxed text-sm md:text-lg">Pursuing B.Tech in CSE from UEM, Jaipur. Specializing in Deep Learning and Agentic Systems to bridge the gap between complex data and elegant intelligence.</p>
                        <div className="flex flex-wrap justify-center gap-6 pt-6">
                            <a href="#projects" className="px-12 py-5 btn-white rounded-2xl text-[12px] font-bold shadow-2xl shadow-white/5 uppercase tracking-widest">View Portfolio</a>
                            <a href="Ankush_Kumar_Mallick_Resume.pdf" download="Ankush_Kumar_Mallick_Resume.pdf" className="px-12 py-5 glass text-white rounded-2xl text-[12px] font-bold border-white/10 hover:bg-white/5 transition-all flex items-center gap-2 uppercase tracking-widest">
                                Download Resume 
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 16a4 4 0 01-.88 2.303M5 21l1.414-1.414M3 21l1.414-1.414M17 11V7a4 4 0 00-8 0v4M5 11V7a4 4 0 018 0v4m-9 8l4.5 4.5 4.5-4.5M12 11v8" strokeWidth="2"/></svg>
                            </a>
                        </div>
                    </div>
                </section>
            );
        };

        const About = () => (
            <section id="about" className="py-32">
                <div className="container mx-auto px-6 max-w-6xl">
                    <div className="grid md:grid-cols-2 gap-20 items-center">
                        <div className="space-y-8">
                            <h2 className="text-4xl md:text-6xl font-outfit font-bold text-white">The Mission</h2>
                            <p className="text-lg text-slate-400 leading-relaxed font-light">I architect intelligent frameworks at the intersection of Deep Learning and Generative AI. Pursuing B.Tech in CSE from <span className="text-white font-bold">University of Engineering & Management (UEM), Jaipur</span>.</p>
                            <div className="p-8 glass rounded-[2.5rem] border-l-4 border-cyan-500">
                                <p className="italic text-slate-300">"Honing skills to design effective AI solutions with a focus on intelligent automation."</p>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            {[ {l:'Projects', v:'10+'}, {l:'Models', v:'20+'}, {l:'GitHub', v:'4'}, {l:'GenAI', v:'Active'} ].map((s,i) => (
                                <div key={i} className="glass p-10 rounded-[2.5rem] text-center glass-card border-white/5">
                                    <div className="text-3xl font-bold text-white mb-1">{s.v}</div>
                                    <div className="text-[10px] uppercase tracking-widest text-slate-500">{s.l}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </section>
        );

        const Skills = () => {
            const cats = [
                { t: "ML and AI", s: ["Supervised", "Unsupervised", "XGBoost", "Neural Networks", "Transformers", "GPT", "BERT", "GenAI"], sz: "md:col-span-2" },
                { t: "Libraries and Framework", s: ["TensorFlow", "Keras", "PyTorch", "Scikit-learn", "NLTK", "Langchain", "Langgraph"], sz: "md:col-span-1" },
                { t: "Programming", s: ["Python", "C", "C++", "SQL"], sz: "md:col-span-1" },
                { t: "Technical Skills", s: ["DBMS", "DSA", "OOPS", "OS", "Fundamentals"], sz: "md:col-span-1" }
            ];
            return (
                <section id="skills" className="py-24">
                    <div className="container mx-auto px-6 max-w-6xl">
                        <div className="flex justify-between items-end mb-16 border-b border-white/5 pb-8">
                            <h2 className="text-4xl md:text-5xl font-outfit font-bold text-white">Arsenal</h2>
                            <span className="text-[10px] font-bold text-slate-500 tracking-widest uppercase mb-2">Technical Inventory</span>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            {cats.map((cat, i) => (
                                <div key={i} className={`glass p-10 rounded-[2.5rem] space-y-8 glass-card border-white/5 ${cat.sz}`}>
                                    <h3 className="text-[10px] font-bold uppercase tracking-[0.3em] text-cyan-500">{cat.t}</h3>
                                    <div className="flex flex-wrap gap-3">
                                        {cat.s.map(skill => (
                                            <span key={skill} className="px-5 py-2.5 bg-white/5 border border-white/5 rounded-2xl text-[11px] font-medium text-slate-400 group-hover:text-white transition-all">{skill}</span>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Projects = () => {
            const ps = [
                { t: "ResuScore AI", s: "Semantic ATS", d: "NLP matching using Sentence Transformers.", sz: "md:col-span-2 md:row-span-2", img: "https://images.unsplash.com/photo-1586281380349-632531db7ed4?w=800", link: "https://github.com/Ankush-22/ResuScore" },
                { t: "ReviewLens", s: "Fake Detector", d: "ML detection of hotel review deception.", sz: "md:col-span-1", img: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=800", link: "https://github.com/Ankush-22/ReviewLens" },
                { t: "Heart Risk AI", s: "Med Diagnostics", d: "Streamlit-based healthcare analytics.", sz: "md:col-span-1", img: "https://images.unsplash.com/photo-1505751172876-fa1923c5c528?w=800", link: "https://github.com/Ankush-22/Heart-Disease-Risk-Prediction" }
            ];
            return (
                <section id="projects" className="py-24">
                    <div className="container mx-auto px-6 max-w-7xl">
                        <h2 className="text-4xl md:text-5xl font-outfit font-bold text-white mb-20 text-center">Intel Systems</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8 auto-rows-[300px]">
                            {ps.map((p, i) => (
                                <a key={i} href={p.link} target="_blank" className={`group glass rounded-[2.5rem] overflow-hidden glass-card border-white/5 relative ${p.sz}`}>
                                    <img src={p.img} className="absolute inset-0 w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700 opacity-30 group-hover:opacity-60" />
                                    <div className="relative z-20 p-10 h-full flex flex-col justify-end">
                                        <div className="text-[9px] font-bold uppercase tracking-widest text-cyan-400 mb-1">{p.s}</div>
                                        <h3 className="text-3xl font-bold dark:text-white group-hover:text-cyan-400 transition-colors">{p.t}</h3>
                                        <p className="text-slate-400 text-sm font-light mt-2">{p.d}</p>
                                        <div className="pt-4 flex items-center text-white/50 group-hover:text-white font-bold text-[10px] uppercase tracking-widest transition-colors">
                                            Source Code →
                                        </div>
                                    </div>
                                </a>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Contact = () => {
             const socials = [
                { i: '📧', l: 'Email', v: 'ankushmallick750@gmail.com', h: 'mailto:ankushmallick750@gmail.com' },
                { i: '🔗', l: 'LinkedIn', v: 'ankush-mallick750', h: 'https://www.linkedin.com/in/ankush-mallick750/' },
                { i: '🐙', l: 'GitHub', v: '@Ankush-22', h: 'https://github.com/Ankush-22' }
            ];
            return (
                <section id="contact" className="py-32 relative overflow-hidden">
                    <div className="container mx-auto px-6 max-w-5xl">
                        <div className="grid md:grid-cols-2 gap-16 items-center">
                            <div className="space-y-12">
                                <h2 className="text-4xl md:text-6xl font-outfit font-bold text-white">Let's build <br/><span className="text-cyan-500">Intelligence</span> together.</h2>
                                <div className="space-y-6">
                                    {socials.map((s, i) => (
                                        <a key={i} href={s.h} target="_blank" className="flex items-center space-x-6 group/item">
                                            <div className="w-14 h-14 glass rounded-2xl flex items-center justify-center text-2xl shadow-xl transition-all group-hover/item:shadow-cyan-500/10 group-hover/item:bg-white/5">
                                                {s.i}
                                            </div>
                                            <div>
                                                <div className="text-[10px] font-bold uppercase tracking-widest text-slate-500">{s.l}</div>
                                                <div className="text-lg font-medium text-slate-200 group-hover:text-white transition-colors">{s.v}</div>
                                            </div>
                                        </a>
                                    ))}
                                </div>
                            </div>
                            <div className="glass p-10 rounded-[3rem] border-white/5 shadow-2xl glass-card">
                                <form className="space-y-6" onSubmit={e => e.preventDefault()}>
                                    <input type="text" placeholder="Name" className="w-full px-8 py-5 bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-cyan-500/50 outline-none dark:text-white transition-all" />
                                    <input type="email" placeholder="Email" className="w-full px-8 py-5 bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-cyan-500/50 outline-none dark:text-white transition-all" />
                                    <textarea rows="4" placeholder="Brief about your vision..." className="w-full px-8 py-5 bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-cyan-500/50 outline-none dark:text-white resize-none transition-all"></textarea>
                                    <button className="w-full py-6 btn-white rounded-[2rem] font-bold text-lg hover:scale-[1.02] active:scale-[0.98] transition-all">Send Message</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Chatbot = () => {
            const [open, setOpen] = React.useState(false);
            const [msgs, setMsgs] = React.useState([{ t: 'bot', text: "Neural connection established. Inquiries?" }]);
            const qs = [
                { q: "Technical Expertise?", a: "Specializes in GenAI, LLMs, and semantic RAG architectures." },
                { q: "Tell me about ResuScore.", a: "Semantic ATS engine with 95% accuracy in matching resumes." }
            ];
            const ask = (q, a) => {
                setMsgs(p => [...p, { t: 'user', text: q }]);
                setTimeout(() => setMsgs(p => [...p, { t: 'bot', text: a }]), 600);
            };
            return (
                <div className="fixed bottom-10 right-10 z-[1000]">
                    <button onClick={() => setOpen(!open)} className="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-2xl hover:scale-110 transition-all text-black border-4 border-black">
                        {open ? '✕' : <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" strokeWidth="2"/></svg>}
                    </button>
                    {open && (
                        <div className="absolute bottom-24 right-0 w-80 h-[500px] glass rounded-[2.5rem] flex flex-col overflow-hidden animate-fade-in-up border-white/20 shadow-2xl">
                            <div className="p-6 bg-white/5 border-b border-white/5 text-[10px] font-bold tracking-[0.2em] uppercase text-cyan-400">Neural Assistant</div>
                            <div className="flex-grow p-6 overflow-y-auto space-y-4 scrollbar-hide">
                                {msgs.map((m, i) => (
                                    <div key={i} className={`flex ${m.t === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`px-4 py-3 rounded-2xl text-xs max-w-[85%] ${m.t === 'user' ? 'bg-white text-black font-medium' : 'bg-white/5 text-slate-300 border border-white/5'}`}>{m.text}</div>
                                    </div>
                                ))}
                            </div>
                            <div className="p-6 space-y-2 border-t border-white/5">
                                {qs.map((q, i) => <button key={i} onClick={() => ask(q.q, q.a)} className="w-full text-left text-[10px] p-3 rounded-xl bg-white/5 border border-white/5 text-slate-400 hover:text-white transition-all">{q.q}</button>)}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            React.useEffect(() => {
                gsap.registerPlugin(ScrollTrigger);
                gsap.utils.toArray('section').forEach(s => {
                    gsap.fromTo(s, { opacity: 0, y: 30 }, { 
                        opacity: 1, y: 0, duration: 1.5, ease: "power4.out",
                        scrollTrigger: { trigger: s, start: "top 90%" }
                    });
                });
            }, []);

            return (
                <div className="min-h-screen">
                    <StarGenerator />
                    <Navbar />
                    <Hero />
                    <About />
                    <Skills />
                    <Projects />
                    <Contact />
                    <Chatbot />
                    <footer className="py-20 text-center border-t border-white/5">
                        <div className="text-xl font-outfit font-bold mb-2">Ankush Kumar Mallick.</div>
                        <div className="text-[10px] tracking-[0.4em] text-slate-500 uppercase">Kinetic AI Portfolio © 2026</div>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
