<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankush Kumar Mallick | AI & ML Engineer Portfolio</title>
    
    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script shadow-config>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        accent: {
                            DEFAULT: '#8b5cf6',
                            secondary: '#3b82f6',
                        }
                    },
                    backgroundImage: {
                        'accent-gradient': 'linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%)',
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap');

        body { font-family: 'Inter', sans-serif; }
        .font-outfit { font-family: 'Outfit', sans-serif; }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .dark .glass {
            background: rgba(15, 23, 42, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .text-gradient {
            background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-premium {
            background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4);
            transition: all 0.3s ease;
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px -5px rgba(139, 92, 246, 0.5);
        }

        .glass-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: rgba(139, 92, 246, 0.05);
            border-color: rgba(139, 92, 246, 0.2);
            transform: translateY(-5px);
        }

        @keyframes drift {
            from { transform: translate(0, 0) rotate(0deg); }
            to { transform: translate(5%, 5%) rotate(5deg); }
        }

        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background: #030712;
        }

        .mesh-circle {
            position: absolute;
            width: 80vw;
            height: 80vw;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            animation: drift 20s infinite alternate;
        }
    </style>

    <script theme-init>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-[#030712] transition-colors duration-300">
    <div class="bg-mesh dark:block hidden">
        <div class="mesh-circle bg-[#8b5cf6] -top-[10%] -left-[10%]"></div>
        <div class="mesh-circle bg-[#3b82f6] -bottom-[10%] -right-[10%]" style="animation-delay: -5s;"></div>
    </div>
    
    <div id="root"></div>

    <script type="text/babel">
        // --- COMPONENTS ---

        const Navbar = ({ isDark, toggleTheme }) => {
            const [isScrolled, setIsScrolled] = React.useState(false);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = React.useState(false);

            React.useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed top-0 w-full z-50 transition-all duration-500 ${isScrolled ? 'py-4 glass border-b border-white/5 shadow-lg' : 'py-6 bg-transparent'}`}>
                    <div className="container mx-auto px-6 flex justify-between items-center text-center">
                        <a href="#" className="flex items-center space-x-2 group">
                            <div className="w-10 h-10 bg-gradient-to-br from-purple-500 to-blue-500 rounded-xl flex items-center justify-center font-bold text-white shadow-lg shadow-purple-500/20 group-hover:rotate-12 transition-transform">A</div>
                            <span className="text-2xl font-outfit font-bold text-slate-900 dark:text-white">Ankush<span className="text-gradient">Kumar.</span></span>
                        </a>
                        <div className="hidden md:flex items-center space-x-8">
                            {['About', 'Skills', 'Projects', 'Experience'].map(l => (
                                <a key={l} href={`#${l.toLowerCase()}`} className="text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-purple-500 transition-colors uppercase tracking-widest">{l}</a>
                            ))}
                            <button onClick={toggleTheme} className="p-2.5 rounded-2xl bg-slate-100 dark:bg-white/5 text-slate-600 dark:text-slate-300 hover:ring-2 ring-purple-500/30 transition-all">
                                {isDark ? '☀️' : '🌙'}
                            </button>
                            <a href="#contact" className="px-6 py-2.5 btn-premium text-white rounded-full font-bold shadow-lg shadow-purple-500/20">Resume</a>
                        </div>
                        <button className="md:hidden text-slate-600 dark:text-slate-300" onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}>Menu</button>
                    </div>
                </nav>
            );
        };

        const Hero = () => {
            const occupations = ["ML Engineer", "AI Engineer", "Data Scientist"];
            const [index, setIndex] = React.useState(0);
            const [subIndex, setSubIndex] = React.useState(0);
            const [reverse, setReverse] = React.useState(false);

            React.useEffect(() => {
                const timeout = setTimeout(() => {
                    if (subIndex === occupations[index].length + 1 && !reverse) return setReverse(true);
                    if (subIndex === 0 && reverse) {
                        setReverse(false);
                        setIndex((prev) => (prev + 1) % occupations.length);
                        return;
                    }
                    setSubIndex(prev => prev + (reverse ? -1 : 1));
                }, reverse ? 75 : 150);
                return () => clearTimeout(timeout);
            }, [subIndex, index, reverse]);

            return (
                <section id="hero" className="min-h-screen flex items-center justify-center pt-20 relative overflow-hidden text-center">
                    <div className="container mx-auto px-6 relative z-10">
                        <div className="max-w-4xl mx-auto space-y-8">
                            <div className="space-y-4">
                                <h2 className="text-xs font-bold tracking-widest uppercase text-slate-500 dark:text-slate-400 bg-white/5 inline-block px-4 py-1.5 rounded-full glass border-white/10 mb-2">Welcome to my universe</h2>
                                <h1 className="text-5xl md:text-8xl font-outfit font-bold text-slate-900 dark:text-white leading-[1.1]">Hi, I'm <span className="text-gradient">Ankush Kumar Mallick</span></h1>
                                <div className="h-16 flex items-center justify-center">
                                    <span className="text-3xl md:text-4xl font-medium text-slate-600 dark:text-slate-400">Aspiring {occupations[index].substring(0, subIndex)}|</span>
                                </div>
                            </div>
                            <p className="text-xl text-slate-600 dark:text-slate-400 max-w-2xl mx-auto leading-relaxed">Dedicated to building intelligent systems that push the boundaries of what's possible with Machine Learning and Generative AI.</p>
                            <div className="flex flex-wrap justify-center gap-6 pt-8">
                                <a href="#projects" className="px-10 py-5 btn-premium text-white rounded-2xl font-bold text-lg hover:scale-105 transition-all shadow-2xl">View Portfolio</a>
                                <a href="#contact" className="px-10 py-5 glass text-slate-900 dark:text-white rounded-2xl font-bold text-lg hover:bg-white/10 transition-all border border-white/10">Get In Touch</a>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const About = () => (
            <section id="about" className="py-24 relative overflow-hidden">
                <div className="container mx-auto px-6">
                    <h2 className="text-4xl md:text-5xl font-outfit font-bold text-slate-900 dark:text-white mb-16 text-center">About Me</h2>
                    <div className="grid md:grid-cols-2 gap-12 items-center max-w-6xl mx-auto">
                        <div className="space-y-6 text-lg text-slate-600 dark:text-slate-300 leading-relaxed">
                            <p>I am an AI enthusiast dedicated to building intelligent systems. My focus lies at the intersection of Machine Learning, Deep Learning, and Generative AI.</p>
                            <p>I specialize in exploring advanced architectures like LLMs and Agentic workflows, designing data-driven solutions for real-world challenges.</p>
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            {[ {l:'Projects', v:'10+'}, {l:'ML Models', v:'20+'}, {l:'GitHub Repos', v:'4'}, {l:'Coffee', v:'∞'} ].map((s,i) => (
                                <div key={i} className="glass p-8 rounded-3xl text-center glass-card border-white/5">
                                    <div className="text-3xl font-bold text-gradient mb-1">{s.v}</div>
                                    <div className="text-xs uppercase tracking-widest text-slate-500">{s.l}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </section>
        );

        const Skills = () => {
            const cats = [
                { t: "ML & AI", s: ["Langchain", "Langgraph", "TensorFlow", "NLTK", "GenAI"] },
                { t: "Programming", s: ["Python", "C", "C++", "SQL"] },
                { t: "Fundamentals", s: ["DSA", "DBMS", "OOPS", "OS"] }
            ];
            return (
                <section id="skills" className="py-24">
                    <div className="container mx-auto px-6">
                        <h2 className="text-4xl md:text-5xl font-outfit font-bold text-slate-900 dark:text-white mb-16 text-center">Tech Stack</h2>
                        <div className="grid md:grid-cols-3 gap-8 max-w-7xl mx-auto">
                            {cats.map((cat, i) => (
                                <div key={i} className="glass p-10 rounded-[2.5rem] space-y-8 glass-card border-white/5">
                                    <h3 className="text-sm font-bold uppercase tracking-[0.2em] text-purple-500">{cat.t}</h3>
                                    <div className="space-y-4">
                                        {cat.s.map(skill => (
                                            <div key={skill} className="flex justify-between items-center group">
                                                <span className="text-slate-700 dark:text-slate-300 font-medium group-hover:text-purple-500 transition-colors">{skill}</span>
                                                <div className="w-12 h-1 bg-gradient-to-r from-purple-500 to-blue-500 rounded-full opacity-30 group-hover:opacity-100 transition-opacity"></div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Projects = () => {
            const projects = [
                { t: "ResuScore - AI ATS", d: "Semantic resume matching using Sentence Transformers.", tags: ["Python", "NLP"], github: "https://github.com/Ankush-22/ResuScore", img: "https://images.unsplash.com/photo-1586281380349-632531db7ed4?q=80&w=600" },
                { t: "ReviewLens", d: "Deceptive hotel review detection using Semantic NLP.", tags: ["ML", "NLP"], github: "https://github.com/Ankush-22/ReviewLens", img: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=600" },
                { t: "Heart Risk Prediction", d: "Healthcare diagnostics with Streamlit.", tags: ["Streamlit", "ML"], github: "https://github.com/Ankush-22/Heart-Disease-Risk-Prediction", img: "https://images.unsplash.com/photo-1505751172876-fa1923c5c528?q=80&w=600" }
            ];
            return (
                <section id="projects" className="py-24">
                    <div className="container mx-auto px-6">
                        <h2 className="text-4xl md:text-5xl font-outfit font-bold text-slate-900 dark:text-white mb-16 text-center">Featured Work</h2>
                        <div className="grid md:grid-cols-3 gap-8 max-w-7xl mx-auto">
                            {projects.map((p, i) => (
                                <a key={i} href={p.github} target="_blank" className="group glass rounded-[2.5rem] overflow-hidden glass-card border-white/5">
                                    <img src={p.img} alt={p.t} className="w-full h-48 object-cover grayscale-[0.5] group-hover:grayscale-0 transition-all duration-700" />
                                    <div className="p-10 space-y-4">
                                        <div className="flex gap-2">
                                            {p.tags.map(t => <span key={t} className="text-[10px] font-bold uppercase tracking-widest px-2 py-1 bg-purple-500/10 text-purple-500 rounded-md">{t}</span>)}
                                        </div>
                                        <h3 className="text-2xl font-bold dark:text-white group-hover:text-purple-500 transition-colors">{p.t}</h3>
                                        <p className="text-slate-500 dark:text-slate-400 text-sm leading-relaxed line-clamp-2">{p.d}</p>
                                        <div className="pt-4 flex items-center text-purple-500 font-bold text-sm">Source Code →</div>
                                    </div>
                                </a>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Contact = () => (
            <section id="contact" className="py-24 relative">
                <div className="container mx-auto px-6 max-w-5xl">
                    <div className="grid md:grid-cols-2 gap-16 items-center">
                        <div className="space-y-8">
                            <h2 className="text-4xl md:text-5xl font-outfit font-bold dark:text-white">Let's build something <span className="text-gradient">extraordinary</span>.</h2>
                            <p className="text-lg text-slate-600 dark:text-slate-400">Open for new opportunities and research collaborations.</p>
                            <div className="text-2xl font-bold text-gradient">ankushmallick750@gmail.com</div>
                        </div>
                        <div className="glass p-10 rounded-[3rem] border-white/5 shadow-2xl glass-card">
                            <form className="space-y-4" onSubmit={e => e.preventDefault()}>
                                <input type="text" placeholder="Name" className="w-full px-6 py-4 bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-purple-500/50 outline-none dark:text-white" />
                                <input type="email" placeholder="Email" className="w-full px-6 py-4 bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-purple-500/50 outline-none dark:text-white" />
                                <textarea rows="3" placeholder="Message" className="w-full px-6 py-4 bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-purple-500/50 outline-none dark:text-white resize-none"></textarea>
                                <button className="w-full py-5 btn-premium text-white rounded-2xl font-bold text-lg">Send Message</button>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
        );

        const App = () => {
            const [isDark, setIsDark] = React.useState(() => document.documentElement.classList.contains('dark'));
            const toggleTheme = () => {
                const newT = !isDark;
                setIsDark(newT);
                document.documentElement.classList.toggle('dark', newT);
                localStorage.theme = newT ? 'dark' : 'light';
            };

            React.useEffect(() => {
                gsap.registerPlugin(ScrollTrigger);
                gsap.utils.toArray('section').forEach(s => {
                    gsap.fromTo(s, { opacity: 0, y: 30 }, { 
                        opacity: 1, y: 0, duration: 1.2, ease: "power3.out",
                        scrollTrigger: { trigger: s, start: "top 90%", toggleActions: "play none none reverse" }
                    });
                });
            }, []);

            return (
                <div className="min-h-screen transition-colors duration-300">
                    <Navbar isDark={isDark} toggleTheme={toggleTheme} />
                    <Hero />
                    <About />
                    <Skills />
                    <Projects />
                    <Contact />
                    <footer className="py-12 border-t dark:border-white/5 text-center">
                        <div className="text-xl font-outfit font-bold dark:text-white mb-2">Ankush Kumar Mallick.</div>
                        <div className="text-slate-500 text-xs tracking-widest">© 2026 AI & ML ENGINEER PORTFOLIO</div>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
